name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：本工作流只读代码跑门禁，不发布、不写仓库。
# 显式声明可避免仓库默认权限放宽时，第三方 action 借 GITHUB_TOKEN 获得多余写权限。
permissions:
  contents: read

# T0-5 门禁自举：故意制造的缺陷必须让 CI 变红。
# 下方「自检 A/B/C」步骤会在 CI 内注入 3 类已知缺陷并断言对应门禁会失败 ——
# 如果某个门禁又变成「永远 exit 0」（如修复前的 check-global-collisions），
# 这一步会先于业务代码失败，从而保证门禁本身是可信的。
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: ⓪ 版本一致性门禁
        run: npm run check:version
      - name: ① 数据与题库结构质检
        run: npm run check:data
      - name: ② 全局声明碰撞扫描（真的会失败）
        run: npm run check:collisions
      - name: ②-b 内联事件/样式 CSP 门禁
        run: npm run check:csp
      - name: ②-c 主题令牌门禁
        run: npm run check:theme
      - name: ②-d 作息表数据门禁
        run: npm run check:schedule
      - name: ③ 代码卫生门禁
        run: npm run check:lint
      - name: ④ 内容语义门禁
        run: npm run check:content
      - name: ④-b 链接完整性门禁（页内锚点 + 跨页深链）
        run: npm run check:anchors
      - name: ④-c MD3 设计一致性门禁
        run: npm run check:md3
      - name: ⑤ defer 时序运行时复现
        run: npm run check:runtime
      - name: ⑤-b 安卓资产同步演练
        run: npm run check:asset-sync
      - name: ⑥ 进度存储单测
        run: npm test
      - name: ⑦ 功能冒烟
        run: npm run test:smoke

      # ---------- 门禁自举：证明这些门禁具备真实失败能力 ----------
      - name: 自检 A · 碰撞扫描能否检出重名
        run: |
          set -e
          printf '\nconst biologyMindMap = 1;\n' >> 1.2/js/app-physics.js
          rc=0
          npm run check:collisions >/dev/null 2>&1 || rc=1
          git checkout -- 1.2/js/app-physics.js
          if [ "$rc" = "0" ]; then
            echo "::error::碰撞扫描未能检出注入的重名声明 —— 门禁失效"
            exit 1
          fi
          echo "OK: 碰撞扫描正确失败"

      - name: 自检 B · 内容门禁能否检出解析/答案矛盾
        run: |
          set -e
          cp 1.2/data/exam/physics.json /tmp/bank.bak
          node -e "
            const fs=require('fs');const p='1.2/data/exam/physics.json';
            const b=JSON.parse(fs.readFileSync(p,'utf8'));
            const q=b.questions[0];
            const other='ABCD'.split('').filter(c=>c!==String(q.answer).toUpperCase())[0];
            q.analysis='故应选'+other+'。'+q.analysis;
            fs.writeFileSync(p,JSON.stringify(b));
          "
          rc=0
          npm run check:data >/dev/null 2>&1 || rc=1
          npm run check:content >/dev/null 2>&1 || rc=1
          cp /tmp/bank.bak 1.2/data/exam/physics.json
          if [ "$rc" = "0" ]; then
            echo "::error::解析/答案矛盾未被任何门禁检出 —— P0-1 防回归失效"
            exit 1
          fi
          echo "OK: 内容门禁正确失败"

      - name: 自检 C · 运行时门禁能否检出解析期捕获
        run: |
          set -e
          # T3-4e 起 index.html 内联脚本已全部外置，syncModules 现居 1.2/js/main-init.js
          #（v1.8 P3 拆分后的非 defer 解析期脚本），注入目标随之迁移。注入后必须断言 probe 真实落盘，
          # 否则锚点漂移会让 replace 静默空转，把「自检装置失效」误报成「门禁失效」。
          cp 1.2/js/main-init.js /tmp/main-inline.bak
          python3 - <<'PY'
          p='1.2/js/main-init.js'
          s=open(p,encoding='utf-8').read()
          anchor='    function syncModules() {'
          if anchor not in s:
              raise SystemExit('注入锚点不存在: '+anchor+' —— 自检装置需随代码迁移更新')
          s=s.replace(anchor,
                      'var PS_probe = window.PlatformSystem;\n'+anchor,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          if ! grep -q 'var PS_probe = window.PlatformSystem;' 1.2/js/main-init.js; then
            echo "::error::probe 注入未生效 —— 自检装置失效（锚点漂移）"
            cp /tmp/main-inline.bak 1.2/js/main-init.js
            exit 1
          fi
          rc=0
          npm run check:runtime >/dev/null 2>&1 || rc=1
          cp /tmp/main-inline.bak 1.2/js/main-init.js
          if [ "$rc" = "0" ]; then
            echo "::error::解析期捕获 defer 模块未被检出 —— P0-10 防回归失效"
            exit 1
          fi
          echo "OK: 运行时门禁正确失败"

      - name: 自检 D · 锚点门禁能否检出坏锚点
        run: |
          set -e
          # 与自检 A/B/C 同标准：注入一个不存在的锚点，check:anchors 必须失败。
          # 先断言 probe 真实落盘，避免注入锚点漂移导致 replace 空转、把
          # 「自检装置失效」误报成「门禁失效」。
          cp 1.2/index.html /tmp/index-anchors.bak
          python3 - <<'PY'
          p = '1.2/index.html'
          s = open(p, encoding='utf-8').read()
          anchor = '<main>'
          if anchor not in s:
              raise SystemExit('注入锚点不存在: ' + anchor + ' —— 自检装置需随代码迁移更新')
          s = s.replace(anchor, anchor + '\n<a href="#gate-selftest-missing">自检注入</a>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          if ! grep -q 'gate-selftest-missing' 1.2/index.html; then
            echo "::error::probe 注入未生效 —— 自检装置失效（锚点漂移）"
            cp /tmp/index-anchors.bak 1.2/index.html
            exit 1
          fi
          rc=0
          npm run check:anchors >/dev/null 2>&1 || rc=1
          cp /tmp/index-anchors.bak 1.2/index.html
          if [ "$rc" = "0" ]; then
            echo "::error::坏锚点未被检出 —— check:anchors 失效"
            exit 1
          fi
          echo "OK: 锚点门禁正确失败"