name: apk-release

# v1.8 起 APK 不再入库（二进制只经 GitHub Release 分发）：
# 发布 Release 时自动构建 APK 并挂到 Release 附件；手动触发则仅产出构建产物。
# 签名密钥经仓库 Secrets 注入（APK_KEYSTORE_BASE64），未配置时生成一次性
# debug 密钥并告警（各次构建签名不连续，无法覆盖升级，仅适合测试）。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          # build-apk.sh 对 build-tools / platforms 有「取最新」兜底，装不上不致命
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0" >/dev/null \
            || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null

      - name: 注入签名密钥
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APK_KEYSTORE_BASE64" ]; then
            echo "$APK_KEYSTORE_BASE64" | base64 -d > android/debug.keystore
            echo "已注入 Secrets 签名密钥"
          else
            echo "::warning::未配置 APK_KEYSTORE_BASE64，生成一次性 debug 密钥——签名不连续，仅适合测试分发"
          fi

      - name: 构建 APK
        run: bash android/build-apk.sh

      # 更新链安全（v1.9 P0）：APK 的 SHA-256 必须与 APK 同源发布。
      # 安卓 UpdateManager 只信任 Release 附件里的 checksums.sha256，
      # 缺失即拒绝自动安装（安全默认），因此这一步是发布的硬前提。
      - name: 生成 SHA-256 校验清单
        run: |
          cd android/releases
          sha256sum *.apk > checksums.sha256
          cat checksums.sha256
          # 断言：清单非空且每个 APK 都有一行
          test -s checksums.sha256
          for f in *.apk; do grep -q "  $f$" checksums.sha256 || { echo "::error::checksums 缺少 $f"; exit 1; }; done

      - name: 上传 Release 附件（APK + 校验清单）
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            android/releases/*.apk android/releases/checksums.sha256 --clobber

      - name: 手动构建产物留档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hspcb-apk
          path: |
            android/releases/*.apk
            android/releases/checksums.sha256
